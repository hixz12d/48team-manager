# Backup file. Prefer the root docker-compose.yml.
# If you must use this file, run it from the repo root:
# docker compose -p team48 -f deploy/docker-compose.yml up -d --build
name: team48

services:
  team48:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: team48-manager:local
    container_name: team48-manager
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8018:8008"
    env_file:
      - ../.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8008"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/team48.db"
      BROWSER_HEADLESS: "false"
      BROWSER_CHANNEL: ""
      DISPLAY: ":99"
      TZ: "Asia/Shanghai"
      AUTO_REAUTH_ENABLED: "${AUTO_REAUTH_ENABLED:-false}"
      AUTO_ROTATE_ENABLED: "false"
      FORCE_REFILL: "false"
    volumes:
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - team48_net
      - sub2api_net

networks:
  team48_net:
    name: team48_net
    driver: bridge
  sub2api_net:
    name: sub2api_sub2api-network
    external: true
