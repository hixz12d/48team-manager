# 备用文件。推荐在仓库根目录用根目录 docker-compose.yml。
# 如果一定要用本文件：cd 到仓库根目录后执行
# docker compose -p team48 -f deploy/docker-compose.yml up -d --build
name: team48

services:
  team48:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: team48-manager:local
    container_name: team48-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:8018:8008"
    env_file:
      - ../.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8008"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/team_manage.db"
      BROWSER_HEADLESS: "true"
      BROWSER_CHANNEL: ""
      TZ: "Asia/Shanghai"
    volumes:
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - team48_net
      - sub2api_net

networks:
  team48_net:
    name: team48_net
    driver: bridge
  sub2api_net:
    name: sub2api_sub2api-network
    external: true
