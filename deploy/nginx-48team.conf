# 独立站点，只反代 127.0.0.1:8018。
# 不要把这段写进 /etc/nginx/sites-enabled/sub2api.conf。
server {
    listen 80;
    listen [::]:80;
    server_name 48team.xiaozhudf2026.foo;

    access_log /var/log/nginx/48team.access.log;
    error_log /var/log/nginx/48team.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 48team.xiaozhudf2026.foo;

    ssl_certificate /etc/letsencrypt/live/48team.xiaozhudf2026.foo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/48team.xiaozhudf2026.foo/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    access_log /var/log/nginx/48team.access.log;
    error_log /var/log/nginx/48team.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
