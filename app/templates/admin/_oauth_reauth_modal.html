<div id="seatOauthModal" class="modal-overlay">
    <div class="modal" style="max-width: 560px;">
        <div class="modal-header">
            <h3 id="seatOauthTitle">重新授权</h3>
            <button type="button" class="modal-close" onclick="closeSeatOauth()">×</button>
        </div>
        <div class="modal-body">
            <p id="seatOauthHelp" class="form-help" hidden></p>
            <div id="seatOauthManual" hidden>
                <div class="oauth-quick-btn-row">
                    <a id="seatOauthLaunch" class="btn btn-primary" href="#" onclick="return launchSeatOauthWindow()">弹出授权窗口</a>
                    <button id="seatOauthInstall" type="button" class="btn btn-secondary" hidden onclick="installSeatOauthProtocol()">安装本机弹出</button>
                </div>
                <textarea id="seatOauthCallback" class="form-control" rows="3" placeholder="如果窗口没弹出来，把跳到 localhost 的完整地址贴这里"></textarea>
                <div class="oauth-quick-btn-row">
                    <button type="button" class="btn btn-primary" onclick="submitSeatOauthCallback()">解析回调并推送</button>
                    <button type="button" class="btn btn-secondary" onclick="startSeatOauthManual()">改走手动</button>
                </div>
            </div>
            <div class="oauth-quick-btn-row">
                <button id="seatOauthCancel" type="button" class="btn btn-secondary" hidden onclick="cancelSeatOauthJob()">停止自动授权</button>
            </div>
            <div id="seatOauthPhoneRow" class="form-group" hidden>
                <label>接码</label>
                <input id="seatOauthPhone" class="form-control" placeholder="+1xxxx----https://...">
                <p class="form-help">OpenAI 要手机号时换一个能过的 +1 接码，再点换号重试。不要用 +86。</p>
                <button type="button" class="btn btn-primary" onclick="retrySeatOauth()">换号重试</button>
            </div>
            <pre id="seatOauthLog" class="onboard-progress-log"></pre>
        </div>
    </div>
</div>
